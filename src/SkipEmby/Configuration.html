<!DOCTYPE html><html><head><meta charset="utf-8"><title>Skip-emby</title></head><body>
<div id="SkipEmbyPage" data-role="page" class="page type-interior pluginConfigurationPage" data-title="Skip-emby" data-controller="__plugin/SkipEmbyConfiguration.js" data-require="emby-input,emby-button,emby-checkbox">
<div data-role="content"><div class="content-primary"><h1>Skip-emby</h1>
<p>只探测同季多集重复的片头和片尾音频，保留其他插件的标准标记。不拦截播放与同步接口。</p>
<form id="SkipEmbyForm"><label class="checkboxContainer"><input is="emby-checkbox" type="checkbox" id="Enabled"><span>启用片头片尾探测</span></label>
<label class="checkboxContainer"><input is="emby-checkbox" type="checkbox" id="DryRun"><span>先试运行 只记录结果不写入标记</span></label>
<h2>选择电视剧媒体库</h2>
<details id="libraryPicker" style="border:1px solid #a0a0a080;border-radius:8px;max-width:640px;margin-bottom:1em">
<summary id="librarySummary" style="padding:14px;cursor:pointer">请选择媒体库（可多选）</summary>
<div style="padding:0 14px 14px"><input is="emby-input" id="librarySearch" type="search" aria-label="搜索媒体库" placeholder="搜索媒体库名称">
<div id="libraries" role="group" aria-label="媒体库多选列表" style="max-height:240px;overflow-y:auto;margin-top:12px"></div>
<p id="libraryEmpty" hidden>没有匹配的电视剧媒体库。</p></div></details>
<p>可展开并勾选多个电视剧媒体库；新建媒体库后重新打开本页即可选择。必须明确选库，留空不执行。定时任务无默认计划。</p>
<label class="checkboxContainer"><input is="emby-checkbox" type="checkbox" id="DetectIntro"><span>探测片头</span></label>
<label class="checkboxContainer"><input is="emby-checkbox" type="checkbox" id="DetectCredits"><span>探测片尾</span></label>
<label class="checkboxContainer"><input is="emby-checkbox" type="checkbox" id="AllowRemoteSources"><span>允许读取 STRM 和远程视频片段</span></label>
<p>音频探测必须由 NAS 读取首尾片段，可能消耗网盘带宽；不会修改 302 播放规则。默认串行运行，不开启并发抽取。</p>
<div class="inputContainer"><label for="IntroWindowSeconds">片头搜索范围 秒</label><input is="emby-input" type="number" min="30" max="600" id="IntroWindowSeconds"></div>
<div class="inputContainer"><label for="CreditsWindowSeconds">片尾搜索范围 秒</label><input is="emby-input" type="number" min="30" max="600" id="CreditsWindowSeconds"></div>
<div class="inputContainer"><label for="MinimumMatchSeconds">至少重复多少秒</label><input is="emby-input" type="number" min="10" max="90" id="MinimumMatchSeconds"></div>
<div class="inputContainer"><label for="MaximumMatchSeconds">单个片头或片尾最长秒数</label><input is="emby-input" type="number" min="10" max="300" id="MaximumMatchSeconds"></div>
<div class="inputContainer"><label for="MinimumEpisodes">至少几集相互验证</label><input is="emby-input" type="number" min="2" max="5" id="MinimumEpisodes"></div>
<div class="inputContainer"><label for="MaxEpisodesPerSeason">每季单次最多读取集数</label><input is="emby-input" type="number" min="2" max="30" id="MaxEpisodesPerSeason"></div>
<div class="inputContainer"><label for="MaxSeasonsPerRun">单次最多处理季数</label><input is="emby-input" type="number" min="1" max="100" id="MaxSeasonsPerRun"></div>
<div class="inputContainer"><label for="ProcessTimeoutSeconds">单次片段读取超时 秒</label><input is="emby-input" type="number" min="30" max="900" id="ProcessTimeoutSeconds"></div>
<div class="inputContainer"><label for="FfmpegPath">FFmpeg 路径 可留空沿用 Emby</label><input is="emby-input" type="text" id="FfmpegPath"></div>
<p>FFmpeg 需要支持 chromaprint。探测依据是重复音频，不保证没有重复音乐的片尾、单集电影、无声字幕或所有特殊剪辑均可识别。客户端是否显示跳过按钮由客户端决定。</p>
<button is="emby-button" type="submit" class="raised button-submit block"><span>保存设置</span></button><p id="skipStatus" role="status"></p></form></div></div>
</div></body></html>
